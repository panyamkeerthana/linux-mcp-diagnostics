variables:
  host_ip: "<ip>"
  service_name: mariadb
  disk_hog_file: /var/lib/mysql/DISK_HOG
  log_dir: /var/log/mariadb
  db_user: mysql
  db_group: mysql
  db_data_dir: /var/lib/mysql

dimensions:
- tool_use:
    description: Correct read-only tool selection, parameters, and sequencing.
    grading_type: score
    scores:
      0: Required tool not called at all.
      1: Tool called with incorrect parameters or wrong order.
      2: Tool called correctly but call count outside min/max bounds.
      3: All checks pass - correct count, order, and parameters.

criteria:
  service_status_check:
    category: Tools
    weight: 3
    dimension: tool_use
    criterion: Check {{service_name}} service status using get_service_status.
    tool_calls:
      respect_order: false
      required:
        - get_service_status:
            min_calls: 1

  service_logs_check:
    category: Tools
    weight: 3
    dimension: tool_use
    criterion: Check {{service_name}} logs using get_journal_logs.
    tool_calls:
      respect_order: false
      required:
        - get_journal_logs:
            min_calls: 1

  disk_usage_check:
    category: Tools
    weight: 3
    dimension: tool_use
    criterion: Check disk usage and available space using execute_command.
    tool_calls:
      respect_order: false
      required:
        - execute_command:
            min_calls: 1

  identify_large_files:
    category: Tools
    weight: 3
    dimension: tool_use
    criterion: Identify large files in {{db_data_dir}} using execute_command.
    tool_calls:
      respect_order: false
      required:
        - execute_command:
            min_calls: 1

  log_directory_permissions_check:
    category: Tools
    weight: 2
    dimension: tool_use
    criterion: Check {{log_dir}} permissions and ownership using execute_command.
    tool_calls:
      respect_order: false
      required:
        - execute_command:
            min_calls: 1

  mariadb_error_log_read:
    category: Tools
    weight: 2
    dimension: tool_use
    criterion: Read MariaDB error log file using read_file.
    tool_calls:
      respect_order: false
      required:
        - read_file:
            min_calls: 1
