variables:
  host_ip: "<ip>"
  service_name: httpd
  target_port: 8088
  httpd_conf_path: /etc/httpd/conf/httpd.conf
  selinux_config_path: /etc/selinux/config
  selinux_mode: enforcing

dimensions:
- tool_use:
    description: Correct read-only tool selection, parameters, and sequencing.
    grading_type: score
    scores:
      0: Required tool not called at all.
      1: Tool called with incorrect parameters or wrong order.
      2: Tool called correctly but call count outside min/max bounds.
      3: All checks pass - correct count, order, and parameters.

criteria:
  initial_service_status_check:
    category: Tools
    weight: 3
    dimension: tool_use
    criterion: Check {{service_name}} service status using get_service_status.
    tool_calls:
      respect_order: false
      required:
        - get_service_status:
            min_calls: 1

  service_journal_logs_check:
    category: Tools
    weight: 3
    dimension: tool_use
    criterion: Retrieve journal logs for {{service_name}} using get_journal_logs.
    tool_calls:
      respect_order: false
      required:
        - get_journal_logs:
            min_calls: 1

  httpd_config_file_read:
    category: Tools
    weight: 2
    dimension: tool_use
    criterion: Read Apache configuration file at {{httpd_conf_path}} using read_file.
    tool_calls:
      respect_order: false
      required:
        - read_file:
            min_calls: 1

  selinux_status_check:
    category: Tools
    weight: 2
    dimension: tool_use
    criterion: Check SELinux status using execute_command with getenforce.
    tool_calls:
      respect_order: false
      required:
        - execute_command:
            min_calls: 1

  selinux_port_configuration_check:
    category: Tools
    weight: 2
    dimension: tool_use
    criterion: Check SELinux port configuration using execute_command with semanage.
    tool_calls:
      respect_order: false
      required:
        - execute_command:
            min_calls: 1
